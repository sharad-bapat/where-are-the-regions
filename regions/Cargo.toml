[package]
name = "regions"
version = "0.1.0"
edition = "2021"
description = "Where are the regions? Every image a born-digital PDF draws, with its box, and the parts that need OCR. Deterministic, no rendering."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "regions-cli"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
# JPEG (DCTDecode) images for the kind layer (D84). Pinned; no SIMD, so native and wasm decode alike.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
# The PDF reading shared with scan-or-text and wordbox: object index, filters, decryption, pages.
pdf-core = { path = "../../pdf-core" }
wasm-bindgen = { version = "0.2", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
